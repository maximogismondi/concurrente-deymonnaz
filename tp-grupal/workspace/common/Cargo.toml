[package]
name = "common"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
actix = "0.13.5"
actix-rt = "2.0" # <-- Runtime for actix
actix_async_handler = "0.1.0"
tokio = { version = "^1", features = ["full"] }
tokio-stream = { version = "^0.1.14", features = ["io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
